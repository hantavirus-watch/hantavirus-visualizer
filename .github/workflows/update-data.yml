name: Update outbreak data

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch outbreak data from the data engine
        env:
          DATA_ENGINE_URL: https://raw.githubusercontent.com/hantavirus-watch/hantavirus-data-engine/main/data/outbreaks.json
        run: |
          mkdir -p hanta-visualizer/public
          curl -fsSL --retry 3 --retry-delay 10 "$DATA_ENGINE_URL" -o hanta-visualizer/public/outbreak.json
          python3 -c "import json; data = json.load(open('hanta-visualizer/public/outbreak.json')); assert isinstance(data, list), 'expected a JSON array'; print(f'Fetched {len(data)} outbreak records from the data engine')"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hanta-visualizer/package-lock.json

      - name: Install dependencies
        working-directory: hanta-visualizer
        run: npm install

      - name: Build
        working-directory: hanta-visualizer
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: hanta-visualizer/build

      - name: Send Telegram update
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: python3 telegram_bot.py

      - name: Skip Telegram update when secrets are missing
        if: ${{ env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == '' }}
        run: echo "Skipping Telegram update because TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
